name: Build release archive

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/jsondashboard
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' ./ build/jsondashboard/
          tar -czf "build/jsondashboard-${VERSION}.tar.gz" -C build jsondashboard
          cd build
          sha256sum "jsondashboard-${VERSION}.tar.gz" > "jsondashboard-${VERSION}.tar.gz.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "build/jsondashboard-${GITHUB_REF_NAME#v}.tar.gz" \
            "build/jsondashboard-${GITHUB_REF_NAME#v}.tar.gz.sha256"
